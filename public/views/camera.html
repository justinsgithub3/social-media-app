<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="/assets/blue-circle.png"/>
    <link rel="stylesheet" href="/styles/style3.css"/>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>justIngram</title>
</head>
<body>
    <header class="header">
        <h1 class="title">Camera</h1>
        <div class="buttons">
            <a id="main-anchor" href="/display/">Go to Album</a>
            <a href="https://www.instagram.com/reels/DHSckc8xcKa/">Go to Peels</a>
        </div>
    </header>
    <div class="main-content">
        <form class="post-form" method="POST" enctype="multipart/form-data" action="/api/images">
            <label for="form-image" class="camera-label">
            <span id="button-text">Open Camera</span>
            <input class="camera" id="form-image" type="file" name="form-image" 
                    accept="image/*" capture="user" style="display: none;"/>
            </label>
        </form>
    </div>

    <script type="module" src="/assets/js/cameraJs.js"></script>
</body>
</html>
